<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24713C">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하준이 포켓몬">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>하준아 포켓몬 잡으러 가자!</title>
</head>
<body>
<style>
/* ============================================================
   포켓몬 잡으러 가자! v2
   6살용 한글 학습 포켓몬 게임 — 60마리 · 진화 · 메가진화
   ============================================================ */

:root{
  --sky:#8FD9F2;
  --sky-deep:#57BADF;
  --grass:#63C266;
  --grass-mid:#3F9E52;
  --grass-deep:#24713C;
  --dirt:#E6C88F;
  --ball:#E8412F;
  --sun:#FFC93C;
  --berry:#F2679B;
  --mega:#B268E0;
  --ink:#1E2B1C;
  --edge:#26331F;
  --ink-soft:#556352;
  --cream:#FFF7E2;
  --panel:#FFFFFF;
  --shadow:0 6px 0 var(--edge);
  --shadow-sm:0 4px 0 var(--edge);
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:var(--grass-deep);
  background-image:radial-gradient(circle at 50% -10%, var(--sky) 0%, var(--sky-deep) 45%, var(--grass-mid) 46%, var(--grass-deep) 100%);
  background-attachment:fixed;
  overscroll-behavior:none;
  user-select:none;
}

#app{
  max-width:520px;margin:0 auto;
  height:100vh;height:100dvh;      /* 도감이 페이지를 늘리지 않고 안에서 스크롤되도록 */
  padding:10px 10px 14px;
  display:flex;flex-direction:column;gap:10px;
}

/* ---------- 공통 ---------- */

.panel{background:var(--panel);border:4px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);}

.sticker{
  font-weight:900;color:#fff;
  -webkit-text-stroke:6px var(--edge);paint-order:stroke fill;
  letter-spacing:-.02em;line-height:1.15;text-wrap:balance;
}

.btn{
  font-family:var(--font);font-weight:900;font-size:20px;color:var(--ink);
  background:var(--cream);border:4px solid var(--edge);border-radius:20px;
  box-shadow:var(--shadow);padding:14px 16px;min-height:64px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:transform .08s, box-shadow .08s, filter .12s;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge);}
.btn:focus-visible{outline:5px solid var(--sun);outline-offset:3px;}
.btn[disabled]{filter:grayscale(.85) brightness(.92);cursor:default;}
.btn[disabled]:active{transform:none;box-shadow:var(--shadow);}

.btn-red{background:var(--ball);color:#fff;}
.btn-yellow{background:var(--sun);}
.btn-green{background:var(--grass);color:#fff;}
.btn-blue{background:var(--sky-deep);color:#fff;}
.btn-white{background:#fff;}
.btn-mega{background:linear-gradient(100deg,#C77BEE,#7B6BE8);color:#fff;}
.btn-big{font-size:26px;min-height:82px;border-radius:26px;}

/* ---------- 그림 상자 (SVG 또는 진짜 이미지) ---------- */

.artbox{display:block;position:relative;}
.artbox > svg, .artbox > img{width:100%;height:100%;display:block;}
.artbox > img{object-fit:contain;}
.artbox > img.px{image-rendering:pixelated;}

/* ---------- 상단 바 ---------- */

#topbar{
  display:flex;align-items:center;gap:8px;
  background:var(--cream);border:4px solid var(--edge);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:8px 10px;min-height:56px;
}
#topbar .title{font-weight:900;font-size:16px;flex:1;letter-spacing:-.03em;}
.count{
  display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;
  font-variant-numeric:tabular-nums;background:#fff;
  border:3px solid var(--edge);border-radius:14px;padding:4px 9px;
}
.icon-btn{
  width:48px;height:48px;flex:0 0 48px;
  display:flex;align-items:center;justify-content:center;font-size:23px;
  background:#fff;border:3px solid var(--edge);border-radius:14px;
  box-shadow:0 3px 0 var(--edge);cursor:pointer;
  transition:transform .08s, box-shadow .08s;
}
.icon-btn:active{transform:translateY(3px);box-shadow:none;}
.icon-btn.off{filter:grayscale(1) brightness(.9);}

#screen{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;}

/* ---------- 시작 ---------- */

.title-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;text-align:center;padding:10px;
}
.title-wrap h1{font-size:clamp(32px,9.5vw,50px);margin:0;}
.title-wrap h1 .l0{display:block;font-size:clamp(26px,7.6vw,38px);color:var(--sun);margin-bottom:-2px;}
.title-wrap h1 .l2{display:block;font-size:clamp(24px,7vw,36px);color:var(--sun);}
.big-ball{width:120px;height:120px;animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-14px) rotate(6deg);}}
.sub{font-weight:800;font-size:15px;color:#fff;-webkit-text-stroke:4px var(--edge);paint-order:stroke fill;margin:2px 0 0;}
.start-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.start-row .btn{font-size:21px;min-height:80px;flex-direction:column;gap:2px;}
.start-row .btn small{font-size:13px;font-weight:800;opacity:.9;}

/* ---------- 파트너 고르기 ---------- */

.pick-grid{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center;}
.pick-card{
  display:flex;align-items:center;gap:14px;
  background:var(--cream);border:4px solid var(--edge);border-radius:24px;
  box-shadow:var(--shadow);padding:10px 16px 10px 10px;cursor:pointer;
  transition:transform .08s, box-shadow .08s;
}
.pick-card:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge);}
.pick-card .artbox{width:92px;height:92px;flex:0 0 92px;}
.pick-card .nm{font-weight:900;font-size:27px;}
.pick-card .ty{font-weight:800;font-size:15px;color:var(--ink-soft);}

/* ---------- 필드 ---------- */

#map{
  position:relative;width:100%;aspect-ratio:1;
  background:var(--grass-mid);border:5px solid var(--edge);border-radius:20px;
  overflow:hidden;display:grid;
  grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  box-shadow:var(--shadow), inset 0 0 0 3px rgba(255,255,255,.18);
}
.tile{position:relative;}
.t0,.t4{background:var(--dirt);}
.t1{background:var(--grass);}
.t2{background:var(--grass-mid);}
.t3{background:var(--sky-deep);}
.tile svg{position:absolute;inset:0;width:100%;height:100%;}
#player{position:absolute;width:11.111%;height:11.111%;left:0;top:0;
  transition:transform .15s cubic-bezier(.3,1.4,.5,1);z-index:3;pointer-events:none;}
#player svg{width:100%;height:100%;overflow:visible;}

.hint{
  text-align:center;font-weight:900;font-size:16px;color:#fff;
  -webkit-text-stroke:5px var(--edge);paint-order:stroke fill;
  min-height:22px;text-wrap:balance;
}

.buddy{
  display:flex;align-items:center;gap:9px;
  background:var(--cream);border:4px solid var(--edge);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:6px 12px 6px 6px;
}
.buddy .artbox{width:52px;height:52px;flex:0 0 52px;}
.buddy .bn{font-weight:900;font-size:17px;}
.buddy .bl{font-weight:800;font-size:13px;color:var(--ink-soft);}
.buddy .grow{flex:1;}

.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;}
.dpad .btn{min-height:58px;font-size:27px;padding:0;}
.dpad .up{grid-column:2;grid-row:1;}
.dpad .left{grid-column:1;grid-row:2;}
.dpad .down{grid-column:2;grid-row:2;}
.dpad .right{grid-column:3;grid-row:2;}
.dpad .dexbtn{grid-column:1;grid-row:1;font-size:16px;}
.dpad .homebtn{grid-column:3;grid-row:1;font-size:16px;}

/* ---------- 배틀 ---------- */

.arena{
  position:relative;flex:1;min-height:200px;
  border:5px solid var(--edge);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(180deg, var(--sky) 0%, var(--sky) 52%, var(--grass) 52%, var(--grass-mid) 100%);
}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;}
.slot.foe{right:5%;top:5%;width:40%;}
.slot.me{left:5%;bottom:3%;width:44%;}
.slot .artbox{width:100%;aspect-ratio:1;animation:idle 2.8s ease-in-out infinite;}
.slot.me .artbox{animation-delay:.4s;}
@keyframes idle{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.nameplate{
  background:var(--cream);border:3px solid var(--edge);border-radius:14px;
  padding:3px 8px;font-weight:900;font-size:14px;white-space:nowrap;
  box-shadow:0 3px 0 var(--edge);
}
.nameplate.m{background:linear-gradient(100deg,#E5C6F7,#C9C2F7);}
.hearts{display:flex;gap:2px;justify-content:center;font-size:14px;line-height:1;}
.hearts .empty{opacity:.26;filter:grayscale(1);}

.hurt{animation:hurt .34s ease;}
@keyframes hurt{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px) rotate(-4deg);}45%{transform:translateX(8px) rotate(4deg);}70%{transform:translateX(-5px);}}
.lunge-me{animation:lungeMe .34s ease;}
@keyframes lungeMe{50%{transform:translate(28px,-18px) scale(1.06);}}
.lunge-foe{animation:lungeFoe .34s ease;}
@keyframes lungeFoe{50%{transform:translate(-28px,18px) scale(1.06);}}

.say{
  background:var(--cream);border:4px solid var(--edge);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:9px 13px;
  font-weight:900;font-size:17px;text-align:center;min-height:52px;
  display:flex;align-items:center;justify-content:center;text-wrap:balance;
}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.acts .btn{font-size:20px;min-height:62px;}
.acts .btn .em{font-size:24px;}
.megabar{min-height:56px;font-size:22px;animation:megaGlow 1.1s ease-in-out infinite;}
@keyframes megaGlow{0%,100%{filter:brightness(1);}50%{filter:brightness(1.3) saturate(1.4);}}
.ready{animation:megaGlow 1s ease-in-out infinite;}

/* ---------- 퀴즈 ---------- */

.quiz{flex:1;display:flex;flex-direction:column;gap:11px;justify-content:center;}
.quiz-head{display:flex;flex-direction:column;align-items:center;gap:7px;}
.quiz-head .artbox{width:112px;height:112px;}
.quiz-q{font-weight:900;font-size:18px;text-align:center;color:#fff;
  -webkit-text-stroke:5px var(--edge);paint-order:stroke fill;text-wrap:balance;}
.speak-again{
  font-family:var(--font);background:var(--sun);border:4px solid var(--edge);
  border-radius:999px;box-shadow:var(--shadow-sm);padding:9px 20px;
  font-weight:900;font-size:17px;cursor:pointer;
}
.speak-again:active{transform:translateY(4px);box-shadow:none;}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.opts.four{grid-template-columns:repeat(2,1fr);}
.opt{
  background:#fff;border:5px solid var(--edge);border-radius:24px;box-shadow:var(--shadow);
  font-family:var(--font);font-weight:900;font-size:clamp(36px,12vw,56px);
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .08s, box-shadow .08s;
}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge);}
.opt.wrong{animation:hurt .4s ease;background:#F3E3E1;}
.opt.good{background:var(--sun);animation:pop .4s ease;}
.opt.nudge{animation:nudge 1s ease-in-out infinite;}
.opt.used{opacity:.25;pointer-events:none;}
@keyframes pop{50%{transform:scale(1.18) rotate(-4deg);}}
@keyframes nudge{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}

.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.slotbox{
  width:60px;height:60px;border:5px dashed var(--edge);border-radius:18px;
  background:rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:33px;
}
.slotbox.filled{border-style:solid;background:var(--sun);}

/* ---------- 도감 ---------- */

.dex{
  flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  align-content:start;
  padding:9px;background:var(--cream);border:4px solid var(--edge);
  border-radius:20px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;
}
.dexcard{
  background:#fff;border:3px solid var(--edge);border-radius:15px;
  padding:4px 2px 5px;text-align:center;cursor:pointer;
  box-shadow:0 3px 0 var(--edge);transition:transform .08s, box-shadow .08s;
}
.dexcard:active{transform:translateY(3px);box-shadow:none;}
.dexcard .artbox{width:100%;aspect-ratio:1;}
.dexcard .nm{font-weight:900;font-size:12px;letter-spacing:-.04em;}
.dexcard.locked{background:#EDEDE6;}
.dexcard.locked .artbox{filter:brightness(0);opacity:.2;}
.dexcard.locked .nm{color:#A9AFA4;}
.dexcard.buddy-on{background:var(--sun);border-width:4px;}

/* 도감 상세 */
#modal{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(20,30,18,.55);
}
#modal.on{display:flex;}
.sheet{
  width:100%;max-width:400px;background:var(--cream);
  border:5px solid var(--edge);border-radius:26px;box-shadow:var(--shadow);
  padding:16px;display:flex;flex-direction:column;align-items:center;gap:9px;
  animation:rise .22s ease;
}
@keyframes rise{from{transform:translateY(24px);opacity:0;}}
.sheet .artbox{width:150px;height:150px;}
.sheet .nm{font-weight:900;font-size:32px;}
.sheet .meta{font-weight:800;font-size:15px;color:var(--ink-soft);}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;}
.chain{display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap;}
.chain .artbox{width:52px;height:52px;}
.chain .step{display:flex;flex-direction:column;align-items:center;width:56px;}
.chain .cn{font-weight:800;font-size:10px;letter-spacing:-.04em;text-align:center;}
.chain .step.dim{opacity:.32;}
.chain .arrow{font-weight:900;color:var(--ink-soft);}

/* ---------- 진화 연출 ---------- */

#evo{
  position:fixed;inset:0;z-index:90;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:radial-gradient(circle at 50% 45%, #FFF9D6 0%, #F5C86B 40%, #7B5AC4 100%);
}
#evo.on{display:flex;}
#evo .artbox{width:min(58vw,240px);height:min(58vw,240px);}
#evo .glow{animation:evoPulse .5s ease-in-out infinite alternate;}
@keyframes evoPulse{from{filter:brightness(1);transform:scale(1);}to{filter:brightness(3.2);transform:scale(1.1);}}
#evo .word{font-size:clamp(28px,9vw,44px);}

/* ---------- 이펙트 ---------- */

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.conf{position:absolute;width:14px;height:14px;border-radius:3px;animation:fall 1.5s ease-out forwards;}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}}

#flash{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;opacity:0;}
#flash.go{animation:flash .5s ease;}
@keyframes flash{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}

.throw{position:fixed;left:50%;top:70%;width:66px;height:66px;z-index:65;pointer-events:none;
  animation:throwBall 1.05s cubic-bezier(.3,.7,.6,1) forwards;}
@keyframes throwBall{
  0%{transform:translate(-50%,0) scale(.6) rotate(0);}
  55%{transform:translate(-50%,-190px) scale(1.05) rotate(540deg);}
  75%{transform:translate(-50%,-150px) scale(1) rotate(700deg);}
  100%{transform:translate(-50%,-150px) scale(1) rotate(720deg);}
}
.wiggle{animation:wig .5s ease-in-out 3;}
@keyframes wig{25%{transform:rotate(-18deg);}75%{transform:rotate(18deg);}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
/* 화면이 짧은 폰 — 스크롤 없이 한 화면에 들어오도록 */
@media (max-height:780px){
  #app{gap:7px;padding:8px 8px 10px;}
  #map{width:min(100%,44vh);margin:0 auto;}
  .dpad .btn{min-height:50px;font-size:23px;}
  .dpad .dexbtn,.dpad .homebtn{font-size:14px;}
  .buddy{padding:4px 10px 4px 4px;}
  .buddy .artbox{width:42px;height:42px;flex-basis:42px;}
  .buddy .bn{font-size:15px;}
  .buddy .bl{font-size:11px;}
  .hint{font-size:14px;min-height:18px;}
  #topbar{min-height:48px;padding:6px 8px;}
  #topbar .title{font-size:14px;}
  .icon-btn{width:42px;height:42px;flex-basis:42px;font-size:20px;}
  .pick-card{padding:7px 12px 7px 7px;gap:11px;}
  .pick-card .artbox{width:66px;height:66px;flex-basis:66px;}
  .pick-card .nm{font-size:23px;}
  .pick-card .ty{font-size:13px;}
  .pick-grid{gap:9px;}
  .btn-big{min-height:60px;font-size:20px;}
  .start-row .btn{min-height:62px;font-size:17px;}
  .big-ball{width:88px;height:88px;}
  .quiz-head .artbox{width:84px;height:84px;}
  .acts .btn{min-height:54px;font-size:18px;}
  .acts .btn .em{font-size:21px;}
  .say{min-height:44px;font-size:15px;padding:7px 11px;}
  .megabar{min-height:48px;font-size:19px;}
  .slotbox{width:50px;height:50px;font-size:27px;}
}
</style>

<div id="app">
  <div id="topbar">
    <div class="title" id="topTitle">하준아 포켓몬 잡으러 가자!</div>
    <div class="count"><span>⚪</span><span id="dexCount">0 / 60</span></div>
    <div class="icon-btn" id="voiceBtn" data-act="mute" role="button" tabindex="0" aria-label="소리 켜기 끄기">🔊</div>
  </div>
  <div id="screen"></div>
</div>
<div id="modal"></div>
<div id="evo"></div>
<div id="fx"></div>
<div id="flash"></div>

<script>
/* 진짜 이미지가 들어가는 자리 — 이미지넣기.bat 이 여기를 채웁니다 */
/*SPRITES_START*/
var SPRITES = {};
/*SPRITES_END*/
</script>

<script>
(function(){
"use strict";

/* =========================================================
   1. 포켓몬 60마리
      evo: 다음 진화 이름 / evoLv: 그 레벨이 되면 진화
      mega: 메가진화 (최종 진화체를 Lv15까지 키우면 발동)
   ========================================================= */

const MONS = [
 /* 이상해씨 라인 */
 {n:'이상해씨',t:'풀',hp:14,evo:'이상해풀',evoLv:5,
  art:{form:'quad',c1:'#8CD1A6',c2:'#4E9C5E',marks:['bulb'],eyes:'round'}},
 {n:'이상해풀',t:'풀',hp:18,evo:'이상해꽃',evoLv:10,
  art:{form:'quad',c1:'#7CC79B',c2:'#E56A9A',marks:['bud'],eyes:'round'}},
 {n:'이상해꽃',t:'풀',hp:23,mega:{n:'메가이상해꽃',art:{c2:'#F2478E',marks:['flower','vine']}},
  art:{form:'quad',c1:'#6FBE90',c2:'#E8548E',marks:['flower'],eyes:'fierce',big:1}},
 /* 파이리 라인 */
 {n:'파이리',t:'불',hp:14,evo:'리자드',evoLv:5,
  art:{form:'biped',c1:'#FF9146',c2:'#FFE0B0',tail:'flame',eyes:'round'}},
 {n:'리자드',t:'불',hp:18,evo:'리자몽',evoLv:10,

/* 이름 → 인덱스 */
const IDX = {};
MONS.forEach((m,i)=>{ IDX[m.n] = i; });
const STARTERS = [IDX['꼬부기'], IDX['파이리'], IDX['피카츄'], IDX['이상해씨']];
const MEGA_LV = 15;

const TYPE_EMOJI = {'전기':'⚡','물':'💧','불':'🔥','풀':'🌿','노말':'⭐','벌레':'🐛','비행':'🪶',
                    '초':'✨','독':'☠️','격투':'🥊','고스트':'👻','땅':'⛰️','얼음':'❄️','드래곤':'🐉'};

/* 진화 라인 계산 */
const PREV = {};
MONS.forEach((m,i)=>{ if(m.evo != null && IDX[m.evo] != null) PREV[IDX[m.evo]] = i; });
function chainOf(i){
  let head = i;
  while(PREV[head] != null) head = PREV[head];
  const out = [head];
  let cur = head;
  while(MONS[cur].evo != null && IDX[MONS[cur].evo] != null){ cur = IDX[MONS[cur].evo]; out.push(cur); }
  return out;
}
function megaForm(m){
  if(!m.mega) return null;
  return { n:m.mega.n, t:m.t, hp:m.hp + 8,
           art:Object.assign({}, m.art, m.mega.art || {}), isMega:true };
}

/* =========================================================
   2. 그림 — 진짜 이미지 우선, 없으면 SVG
   ========================================================= */

const E = '#26331F';
const SW = 3;

function dark(hex,f){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*f), g = Math.round(((n>>8)&255)*f), b = Math.round((n&255)*f);
  return '#'+[r,g,b].map(v=>Math.min(255,Math.max(0,v)).toString(16).padStart(2,'0')).join('');
}
function ell(cx,cy,rx,ry,fill,rot){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${E}" stroke-width="${SW}"${rot?` transform="rotate(${rot} ${cx} ${cy})"`:''}/>`;
}
function soft(cx,cy,rx,ry,fill,rot){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}"${rot?` transform="rotate(${rot} ${cx} ${cy})"`:''}/>`;
}
function pth(d,fill){
  return `<path d="${d}" fill="${fill}" stroke="${E}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function line(d,w,col){
  return `<path d="${d}" fill="none" stroke="${col||E}" stroke-width="${w||2.6}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* 눈 */
function drawEyes(x1,x2,y,r,kind){
  let s='';
  if(kind==='sleepy' || kind==='closed'){
    for(const x of [x1,x2]) s += line(`M${x-r} ${y} q${r} ${kind==='closed'?-r*0.9:r*0.9} ${r*2} 0`, 3);
    return s;
  }
  if(kind==='dot'){
    for(const x of [x1,x2]) s += `<circle cx="${x}" cy="${y}" r="${r*0.55}" fill="#20241f"/>`;
    return s;
  }
  const rr = kind==='big' ? r*1.24 : r;
  for(const x of [x1,x2]){
    s += `<ellipse cx="${x}" cy="${y}" rx="${rr}" ry="${rr*1.15}" fill="#fff" stroke="${E}" stroke-width="2.6"/>`;
    s += `<circle cx="${x}" cy="${y+rr*0.16}" r="${rr*0.52}" fill="#20241f"/>`;
    s += `<circle cx="${x-rr*0.24}" cy="${y-rr*0.34}" r="${rr*0.24}" fill="#fff"/>`;
  }
  if(kind==='fierce'){
    s += pth(`M${x1-r-2} ${y-r*1.5} L${x1+r+1} ${y-r*0.5} L${x1+r+1} ${y-r*1.3} Z`, E);
    s += pth(`M${x2+r+2} ${y-r*1.5} L${x2-r-1} ${y-r*0.5} L${x2-r-1} ${y-r*1.3} Z`, E);
  }
  return s;
}
/* 입 */
function drawMouth(cx,cy,w,kind,c2){
  if(kind==='none') return '';
  if(kind==='beak') return `<ellipse cx="${cx}" cy="${cy+1}" rx="${w*2.1}" ry="${w*1.3}" fill="${c2}" stroke="${E}" stroke-width="2.6"/>`
                          + line(`M${cx-w*2.1} ${cy+1} H${cx+w*2.1}`, 2.2);
  if(kind==='flat') return line(`M${cx-w} ${cy} H${cx+w}`, 2.8);
  if(kind==='open') return `<ellipse cx="${cx}" cy="${cy+1}" rx="${w*0.9}" ry="${w*1.1}" fill="#5B2230" stroke="${E}" stroke-width="2.4"/>`;
  if(kind==='fang') return line(`M${cx-w} ${cy} Q${cx} ${cy+w*0.9} ${cx+w} ${cy}`, 2.8)
                         + pth(`M${cx-w*0.6} ${cy+w*0.35} l3 5 l3 -5 Z`, '#fff')
                         + pth(`M${cx+w*0.6} ${cy+w*0.35} l-3 5 l-3 -5 Z`, '#fff');
  return line(`M${cx-w} ${cy} Q${cx} ${cy+w*0.9} ${cx+w} ${cy}`, 2.8);
}

/* 귀 · 머리 장식 */
function drawEars(kind,cx,ty,c1,c2){
  switch(kind){
    case 'pointy':      return pth(`M${cx-16} ${ty+6} L${cx-30} ${ty-24} L${cx-4} ${ty+1} Z`,c1)
                             + pth(`M${cx+16} ${ty+6} L${cx+30} ${ty-24} L${cx+4} ${ty+1} Z`,c1)
                             + pth(`M${cx-30} ${ty-24} L${cx-25} ${ty-11} L${cx-21} ${ty-22} Z`,'#3A3126')
                             + pth(`M${cx+30} ${ty-24} L${cx+25} ${ty-11} L${cx+21} ${ty-22} Z`,'#3A3126');
    case 'longRabbit':  return ell(cx-20,ty-9,9,17,c1,-20) + ell(cx+20,ty-9,9,17,c1,20)
                             + soft(cx-20,ty-9,4,9,c2,-20) + soft(cx+20,ty-9,4,9,c2,20);
    case 'roundSmall':  return ell(cx-22,ty+2,9,9,c1) + ell(cx+22,ty+2,9,9,c1);
    case 'fluffTuft':   return pth(`M${cx-20} ${ty+2} Q${cx-34} ${ty-14} ${cx-24} ${ty-18} Q${cx-16} ${ty-20} ${cx-10} ${ty-4} Z`,c2)
                             + pth(`M${cx+20} ${ty+2} Q${cx+34} ${ty-14} ${cx+24} ${ty-18} Q${cx+16} ${ty-20} ${cx+10} ${ty-4} Z`,c2);
    case 'horn1':       return pth(`M${cx+12} ${ty-2} L${cx+32} ${ty-16} L${cx+20} ${ty+6} Z`,c2);
    case 'horn2':       return pth(`M${cx-10} ${ty-6} L${cx-26} ${ty-26} L${cx-4} ${ty-12} Z`,c2)
                             + pth(`M${cx+10} ${ty-6} L${cx+26} ${ty-26} L${cx+4} ${ty-12} Z`,c2);
    case 'curlHair':    return pth(`M${cx-6} ${ty-2} Q${cx-10} ${ty-22} ${cx+8} ${ty-18} Q${cx-2} ${ty-12} ${cx+6} ${ty-2} Z`,c1);
    case 'antenna':     return line(`M${cx-8} ${ty+2} L${cx-14} ${ty-16}`,3.2) + line(`M${cx+8} ${ty+2} L${cx+14} ${ty-16}`,3.2)
                             + `<circle cx="${cx-14}" cy="${ty-18}" r="5" fill="${c2}" stroke="${E}" stroke-width="2.6"/>`
                             + `<circle cx="${cx+14}" cy="${ty-18}" r="5" fill="${c2}" stroke="${E}" stroke-width="2.6"/>`;
    case 'antennaBall': return line(`M${cx-9} ${ty} L${cx-17} ${ty-14}`,3.4) + line(`M${cx+9} ${ty} L${cx+17} ${ty-14}`,3.4)
                             + `<circle cx="${cx-18}" cy="${ty-17}" r="6" fill="${c2}" stroke="${E}" stroke-width="2.8"/>`
                             + `<circle cx="${cx+18}" cy="${ty-17}" r="6" fill="${c2}" stroke="${E}" stroke-width="2.8"/>`;
    case 'fin':         return pth(`M${cx} ${ty-2} L${cx-5} ${ty-27} L${cx+11} ${ty-8} Z`,c2)
                             + ell(cx-24,ty+8,7,13,c2,-24) + ell(cx+24,ty+8,7,13,c2,24);

   3. 한글 도우미
   ========================================================= */

const EASY_JUNG = [0,2,4,6,8,12,13,17,18,20];
const EASY_CHO  = [0,2,3,5,6,7,9,11,12,14,15,16,17,18];

function decomp(ch){
  const code = ch.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null;
  return { cho:Math.floor(code/588), jung:Math.floor((code%588)/28), jong:code%28 };
}
function comp(cho,jung,jong){ return String.fromCharCode(0xAC00 + cho*588 + jung*28 + (jong||0)); }
function josa(word,pair){
  const d = decomp(word[word.length-1]);
  return (d && d.jong > 0) ? pair[0] : pair[1];
}
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function makeDistractors(ch,count,level){
  const d = decomp(ch), out = [], seen = new Set([ch]);
  let guard = 0;
  while(out.length < count && guard++ < 200){
    let cand;
    if(!d){ cand = pick(['가','나','다','라','마','바','사']); }
    else if(level === 1){ cand = comp(d.cho, pick(EASY_JUNG), 0); }
    else {
      const roll = Math.random();
      if(roll < 0.45)      cand = comp(d.cho, pick(EASY_JUNG), 0);
      else if(roll < 0.85) cand = comp(pick(EASY_CHO), d.jung, 0);
      else                 cand = comp(d.cho, d.jung, d.jong ? 0 : pick([1,4,8,16,17,21]));
    }
    if(!seen.has(cand)){ seen.add(cand); out.push(cand); }
  }
  return out;
}

let audioCtx = null;
function ac(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur,type,vol,delay){
  if(!S.voice) return;
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.07,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

let koVoice = null;
function loadVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v=>v.lang==='ko-KR') || vs.find(v=>(v.lang||'').startsWith('ko')) || null;
}
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text,opts){
  if(!S.voice || !text || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if(koVoice) u.voice = koVoice;
    u.rate  = (opts && opts.rate)  || 0.92;
    u.pitch = (opts && opts.pitch) || 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sayLetters(w){ say(w.split('').join(', '), {rate:0.6, pitch:1.2}); }

  2,0,2,1,1,1,2,0,2,
  2,1,1,1,0,1,1,1,2,
  2,1,1,0,0,0,1,1,2,
  2,1,1,1,0,1,1,1,2,
  2,4,2,1,1,1,2,4,2,
  2,0,0,1,1,1,0,0,2,
  2,2,3,3,2,3,3,2,2
];
const BLOCKED = [2,3];
const SAVE_KEY = 'pokemon-catch-v2';

const S = {
  screen:'title', voice:true,
  partner:null,          // 현재 같이 다니는 포켓몬 인덱스
  mons:{},               // { 인덱스: {lv} } 내가 가진 포켓몬
  dex:[],                // 도감에 등록된 인덱스
  hp:20, maxHp:20,
  px:4, py:4,
  wild:null, quiz:null, msg:'',
  megaOn:false,
  detail:null
};

let memoryStore = null;
function save(){
  const d = {voice:S.voice, partner:S.partner, mons:S.mons, dex:S.dex, hp:S.hp, maxHp:S.maxHp, px:S.px, py:S.py};
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(d)); }catch(e){ memoryStore = d; }
}
function load(){
  let d = null;
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) d = JSON.parse(raw); }catch(e){ d = memoryStore; }
  if(!d) return false;
  S.voice = d.voice !== false;
  S.partner = d.partner;
  S.mons = d.mons || {};
  S.dex = Array.isArray(d.dex) ? d.dex : [];
  S.hp = d.hp; S.maxHp = d.maxHp;
  S.px = typeof d.px === 'number' ? d.px : 4;
  S.py = typeof d.py === 'number' ? d.py : 4;
  return S.partner != null && MONS[S.partner] != null;
}
function wipe(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  memoryStore = null;
  S.partner = null; S.mons = {}; S.dex = []; S.px = 4; S.py = 4;
  S.wild = null; S.quiz = null; S.megaOn = false; S.msg = '';
}

function pLv(){ const e = S.mons[S.partner]; return e ? e.lv : 1; }
function pMon(){ return MONS[S.partner]; }
function pActive(){ return S.megaOn ? (megaForm(pMon()) || pMon()) : pMon(); }
function pMaxHp(){ const base = pMon().hp; return 12 + base + pLv()*2; }
function canMega(){
  const m = pMon();
  return !!(m && m.mega && pLv() >= MEGA_LV && !S.megaOn);
}
function quizLevel(){
  const n = S.dex.length;
  if(n < 5) return 1;
  if(n < 13) return 2;
  return 3;
}
function hearts(hp,max){
  const filled = Math.max(0, Math.ceil(hp / (max/5)));
  let s='';
  for(let i=0;i<5;i++) s += `<span class="${i<filled?'':'empty'}">❤️</span>`;
  return `<div class="hearts">${s}</div>`;
}

/* =========================================================
   6. 화면
   ========================================================= */

const screenEl = document.getElementById('screen');
const topTitle = document.getElementById('topTitle');
const dexCount = document.getElementById('dexCount');
const voiceBtn = document.getElementById('voiceBtn');
const modalEl  = document.getElementById('modal');

function render(){
  dexCount.textContent = `${S.dex.length} / ${MONS.length}`;
  voiceBtn.textContent = S.voice ? '🔊' : '🔇';
  voiceBtn.classList.toggle('off', !S.voice);

  const V = {
    title:  ['하준아 포켓몬 잡으러 가자!', viewTitle],
    pick:   ['친구를 골라요',      viewPick],
    field:  ['풀숲을 걸어 봐요',   viewField],
    battle: ['야생 포켓몬!',       viewBattle],
    quiz:   ['이름을 읽어 보자!',  viewQuiz],
    dex:    ['포켓몬 도감',        viewDex]
  }[S.screen];
  topTitle.textContent = V[0];
  screenEl.innerHTML = V[1]();
  if(S.screen === 'field') placePlayer();
  renderModal();
}

function viewTitle(){
  const has = S.partner != null && MONS[S.partner];
  return `
  <div class="title-wrap panel" style="background:linear-gradient(180deg,#BFEAF9,#EAF9E4);">
    ${ballSvg('big-ball')}
    <h1 class="sticker"><span class="l0">하준아!</span>포켓몬<span class="l2">잡으러 가자!</span></h1>
    <p class="sub">읽고, 만나고, 잡아요</p>
  </div>
  ${has ? `
  <div class="start-row">
    <button class="btn btn-red" data-act="resume">▶ 이어서<small>${MONS[S.partner].n} · ${S.dex.length}마리</small></button>
    <button class="btn btn-yellow" data-act="newgame">🆕 새로 시작<small>처음부터</small></button>
  </div>`
  : `<button class="btn btn-big btn-red" data-act="newgame">▶ 시작하기</button>`}`;
}

function viewPick(){
  return `<div class="hint">누구랑 같이 갈까?</div><div class="pick-grid">` +
    STARTERS.map(i=>{
      const m = MONS[i];
      return `<div class="pick-card" data-act="pick:${i}" role="button" tabindex="0">
        ${artBox(m,92)}
        <div><div class="nm">${m.n}</div><div class="ty">${TYPE_EMOJI[m.t]||'⭐'} ${m.t} 타입</div></div>
      </div>`;
    }).join('') + `</div>`;
}

function viewField(){
  let tiles='';
  for(let i=0;i<81;i++) tiles += `<div class="tile t${MAP[i]}">${TILE_ART[MAP[i]]||''}</div>`;
  const m = pMon();
  const next = m.evo && IDX[m.evo] != null ? `Lv.${m.evoLv} 에 ${m.evo}` : (m.mega ? `Lv.${MEGA_LV} 에 메가진화 ✨` : '최고로 컸어요!');
  return `
  <div class="buddy">
    ${artBox(pActive(),52)}
    <div class="grow"><div class="bn">${pActive().n}</div><div class="bl">Lv.${pLv()} · ${next}</div></div>
    ${hearts(S.hp, S.maxHp)}
  </div>
  <div id="map">${tiles}<div id="player">${kidSvg()}</div></div>
  <div class="hint">${S.msg || '풀숲🌿 을 걸으면 포켓몬이 나와요'}</div>
  <div class="dpad">
    <button class="btn btn-white dexbtn" data-act="dex">📖 도감</button>
    <button class="btn btn-green up" data-act="mv:u" aria-label="위로">⬆️</button>
    <button class="btn btn-white homebtn" data-act="home">🏠</button>
    <button class="btn btn-green left" data-act="mv:l" aria-label="왼쪽">⬅️</button>
    <button class="btn btn-green down" data-act="mv:d" aria-label="아래로">⬇️</button>
    <button class="btn btn-green right" data-act="mv:r" aria-label="오른쪽">➡️</button>
  </div>`;
}
function placePlayer(){
  const p = document.getElementById('player');
  if(p) p.style.transform = `translate(${S.px*100}%, ${S.py*100}%)`;
}

function viewBattle(){
  const w = S.wild, wm = MONS[w.mi], me = pActive();
  const ready = w.hp <= w.max/2;
  return `
  <div class="arena">
    <div class="slot foe">
      <div class="nameplate">${wm.n} ${TYPE_EMOJI[wm.t]||''}</div>
      ${hearts(w.hp,w.max)}
      ${artBox(wm,0,'')}
    </div>
    <div class="slot me">
      ${artBox(me,0,'')}
      <div class="nameplate${S.megaOn?' m':''}">${me.n} · Lv.${pLv()}</div>
      ${hearts(S.hp,S.maxHp)}
    </div>
  </div>
  <div class="say" id="say">${S.msg}</div>
  ${canMega() ? `<button class="btn btn-mega megabar" data-act="mega">✨ 메가진화! ✨</button>` : ''}
  <div class="acts">
    <button class="btn btn-red" data-act="atk"><span class="em">💥</span> 공격</button>
    <button class="btn btn-green" data-act="heal"><span class="em">💚</span> 회복</button>
    <button class="btn ${ready?'btn-yellow ready':'btn-white'}" data-act="ball" ${ready?'':'disabled'}>
      <span class="em">${ready?'⚪':'🔒'}</span> ${ready?'몬스터볼!':'몬스터볼'}
    </button>
    <button class="btn btn-blue" data-act="run"><span class="em">🏃</span> 도망</button>
  </div>`;
}

function viewQuiz(){
  const q = S.quiz, wm = MONS[S.wild.mi];
  const head = `<div class="quiz-head">${artBox(wm,112)}`;
  if(q.mode === 'order'){
    const slots = q.answer.map((_,i)=>`<div class="slotbox ${i<q.placed.length?'filled':''}">${q.placed[i]||''}</div>`).join('');
    const opts  = q.options.map((ch,i)=>`<div class="opt ${q.used.indexOf(i)>=0?'used':''}" data-act="ord:${i}" role="button" tabindex="0">${ch}</div>`).join('');
    return `<div class="quiz">${head}
        <div class="quiz-q">이름을 순서대로 눌러 봐!</div>
        <button class="speak-again" data-act="hear">🔊 다시 듣기</button></div>
      <div class="slots">${slots}</div>
      <div class="opts ${q.options.length>3?'four':''}">${opts}</div></div>`;
  }
  const opts = q.options.map((ch,i)=>`<div class="opt ${q.tries>=2 && ch===q.answer?'nudge':''}" data-act="ans:${i}" role="button" tabindex="0">${ch}</div>`).join('');
  return `<div class="quiz">${head}
      <div class="quiz-q">${q.tries>=2 ? '반짝이는 글자를 눌러 봐!' : `${wm.n}! &nbsp;첫 글자는 무엇일까?`}</div>
      <button class="speak-again" data-act="hear">🔊 다시 듣기</button></div>
    <div class="opts ${q.options.length>3?'four':''}">${opts}</div></div>`;
}

function viewDex(){
  const cards = MONS.map((m,i)=>{
    const got = S.dex.indexOf(i) >= 0;
    return `<div class="dexcard ${got?'':'locked'} ${i===S.partner?'buddy-on':''}" data-act="${got?`info:${i}`:'nope'}" role="button" tabindex="0">
      ${artBox(m,0,'')}<div class="nm">${got ? m.n : '? ? ?'}</div></div>`;
  }).join('');
  return `<div class="dex">${cards}</div>
  <button class="btn btn-big btn-green" data-act="back">🌿 계속 탐험하기</button>`;
}

function renderModal(){
  if(S.detail == null){ modalEl.className = ''; modalEl.innerHTML = ''; return; }
  const i = S.detail, m = MONS[i];
  const owned = S.mons[i];
  const chain = chainOf(i);
  const chainHtml = chain.map((ci,k)=>{
    const cm = MONS[ci], seen = S.dex.indexOf(ci) >= 0;
    return (k ? `<span class="arrow">▸</span>` : '') +
      `<div class="step ${seen?'':'dim'}">${artBox(cm,0,'')}<div class="cn">${seen?cm.n:'???'}</div></div>`;
  }).join('');
  modalEl.className = 'on';
  modalEl.innerHTML = `<div class="sheet">
    ${artBox(m,150)}
    <div class="nm">${m.n}</div>
    <div class="meta">${TYPE_EMOJI[m.t]||'⭐'} ${m.t} 타입 ${owned ? `· Lv.${owned.lv}` : ''}</div>
    ${chain.length > 1 ? `<div class="chain">${chainHtml}</div>` : ''}
    <div class="row">
      <button class="btn btn-yellow" data-act="sayname:${i}" style="min-height:56px;font-size:17px;">🔊 이름 듣기</button>
      ${i === S.partner
        ? `<button class="btn btn-white" style="min-height:56px;font-size:17px;" disabled>🤝 같이 가는 중</button>`
        : `<button class="btn btn-green" data-act="buddy:${i}" style="min-height:56px;font-size:17px;">🤝 같이 가기</button>`}
    </div>
    <button class="btn btn-white" data-act="closeinfo" style="min-height:52px;width:100%;font-size:17px;">닫기</button>
  </div>`;
}

/* =========================================================
   7. 진행
   ========================================================= */

function newGame(){
  wipe();
  S.screen = 'pick'; SFX.open(); render();
  say('같이 갈 친구를 골라 봐!');
}
function choose(i){
  const m = MONS[i];
  S.partner = i;
  S.mons[i] = {lv:1};
  if(S.dex.indexOf(i) < 0) S.dex.push(i);
  S.maxHp = pMaxHp(); S.hp = S.maxHp;
  S.screen = 'field'; S.msg = `${m.n}${josa(m.n,['과','와'])} 함께 출발!`;
  SFX.good(); save(); render();
  say(`${m.n}! 같이 가자!`);
}

function move(dir){
  if(S.screen !== 'field') return;
  let nx=S.px, ny=S.py;
  if(dir==='u') ny--; else if(dir==='d') ny++; else if(dir==='l') nx--; else if(dir==='r') nx++;
  if(nx<0||nx>8||ny<0||ny>8) return;
  const tile = MAP[ny*9+nx];
  if(BLOCKED.indexOf(tile) >= 0){ tone(150,0.08,'square',0.04); return; }
  S.px=nx; S.py=ny; SFX.step(); placePlayer(); save();
  if(tile === 1 && Math.random() < 0.24) setTimeout(startBattle, 190);
}

function startBattle(){
  const weights = MONS.map((m,i)=>{
    let w = m.rare === 2 ? 1 : (m.evo == null && PREV[i] != null ? 3 : 10);
    if(S.dex.indexOf(i) < 0) w *= 3;         /* 아직 못 본 애를 더 자주 */
    return w;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total, mi = 0;
  for(let i=0;i<weights.length;i++){ r -= weights[i]; if(r <= 0){ mi = i; break; } }

  const m = MONS[mi];
  S.wild = {mi, hp:m.hp, max:m.hp};
  S.megaOn = false;
  const ga = josa(m.n,['이','가']);
  S.msg = `앗! 야생 ${m.n}${ga} 나타났다!`;
  S.screen = 'battle';
  flash(); SFX.encounter(); render();
  say(`야생 ${m.n}${ga} 나타났다!`);
}

function bump(sel,cls){
  const el = document.querySelector(sel);
  if(!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}

function attack(){
  const w = S.wild, wm = MONS[w.mi];
  const dmg = 4 + Math.floor(Math.random()*3) + Math.floor(pLv()/2) + (S.megaOn ? 5 : 0);
  w.hp = Math.max(0, w.hp - dmg);
  bump('.slot.me .artbox','lunge-me');
  SFX.hit();
  setTimeout(()=>{
    const weak = w.hp <= w.max/2;
    if(w.hp === 0){
      w.hp = 1;
      S.msg = `${wm.n}${josa(wm.n,['이','가'])} 지쳤어! 지금 볼을 던져!`;
      render(); say('지금이야! 몬스터볼을 던져!');
      return;
    }
    S.msg = weak ? '잘했어! 이제 몬스터볼을 던질 수 있어!' : `${wm.n}에게 공격!`;
    render(); bump('.slot.foe .artbox','hurt');
    if(weak) say('지금이야! 몬스터볼을 던져!');
    setTimeout(foeTurn, 520);
  }, 340);
}

function foeTurn(){
  const wm = MONS[S.wild.mi];
  const dmg = 1 + Math.floor(Math.random()*3);
  S.hp = Math.max(0, S.hp - dmg);
  bump('.slot.foe .artbox','lunge-foe');
  SFX.hit();
  setTimeout(()=>{
    if(S.hp === 0){
      S.hp = S.maxHp;
      S.msg = '잠깐 쉬자! 힘이 다시 가득 찼어 💚';
      SFX.heal(); render(); say('잠깐 쉬자! 힘이 다시 가득 찼어!');
    } else {
      S.msg = `${wm.n}의 공격!`;
      render(); bump('.slot.me .artbox','hurt');
    }
    save();
  }, 320);
}

function heal(){
  S.hp = Math.min(S.maxHp, S.hp + 7);
  S.msg = '힘이 났다! 💚';
  SFX.heal(); save(); render(); say('힘이 났다!');
}
function run(){
  S.screen = 'field'; S.msg = '휴~ 도망쳤다!'; S.wild = null; S.megaOn = false;
  SFX.open(); render(); say('도망쳤다!');
}

function doMega(){
  if(!canMega()) return;
  const base = pMon(), mf = megaForm(base);
  S.megaOn = true;
  S.hp = S.maxHp;
  SFX.mega();
  showEvo(base, mf, '메가진화!', ()=>{
    S.msg = `${mf.n}${josa(mf.n,['으로','로'])} 메가진화했다! ✨`;
    render();
    say(`${mf.n}${josa(mf.n,['으로','로'])} 메가진화!`);
  });
}

/* ---- 퀴즈 ---- */
function openQuiz(){
  const wm = MONS[S.wild.mi], lv = quizLevel();
  if(lv === 3 && wm.n.length >= 2){
    S.quiz = {mode:'order', answer:wm.n.split(''), options:shuffle(wm.n.split('')), placed:[], used:[], tries:0};
  } else {
    const first = wm.n[0], n = (lv === 1 ? 2 : 3);
    S.quiz = {mode:'first', answer:first, options:shuffle([first].concat(makeDistractors(first,n,lv))), tries:0};
  }
  S.screen = 'quiz'; SFX.open(); render();
  setTimeout(hearQuiz, 260);
}
function hearQuiz(){
  const wm = MONS[S.wild.mi];
  if(S.quiz.mode === 'order'){
    say(wm.n,{rate:0.85});
    setTimeout(()=>sayLetters(wm.n), 900);
  } else {
    say(wm.n,{rate:0.85});
    setTimeout(()=>say(`첫 글자, ${S.quiz.answer}`,{rate:0.6,pitch:1.2}), 950);
  }
}
function answerFirst(i){
  const q = S.quiz, ch = q.options[i], el = document.querySelectorAll('.opt')[i];
  if(ch === q.answer){
    if(el) el.classList.add('good');
    SFX.good(); say('잘했어!');
    setTimeout(doCatch, 620);
  } else {
    q.tries++;
    if(el) el.classList.add('wrong');
    SFX.bad();
    say(q.tries >= 2 ? '괜찮아, 반짝이는 글자를 눌러 봐' : '다시 해 볼까?');
    setTimeout(render, 480);
  }
}
function answerOrder(i){
  const q = S.quiz;
  if(q.used.indexOf(i) >= 0) return;
  const ch = q.options[i], need = q.answer[q.placed.length], el = document.querySelectorAll('.opt')[i];
  if(ch === need){
    q.placed.push(ch); q.used.push(i);
    tone(600 + q.placed.length*90, 0.14, 'triangle', 0.07);
    say(ch,{rate:0.6,pitch:1.2});
    if(q.placed.length === q.answer.length){
      SFX.good();
      setTimeout(()=>say('잘했어!'), 300);
      setTimeout(doCatch, 800);
    }
    render();
  } else {
    q.tries++;
    if(el) el.classList.add('wrong');
    SFX.bad(); say('다시 해 볼까?');
    setTimeout(render, 460);
  }
}

/* ---- 포획 ---- */
function doCatch(){
  const mi = S.wild.mi, m = MONS[mi];
  const ball = document.createElement('div');
  ball.className = 'throw';
  ball.innerHTML = ballSvg();
  document.getElementById('fx').appendChild(ball);
  tone(760,0.12,'triangle',0.07);
  setTimeout(()=>{ ball.classList.add('wiggle'); tone(420,0.1,'square',0.05); }, 1050);
  setTimeout(()=>{
    ball.remove();
    if(S.dex.indexOf(mi) < 0) S.dex.push(mi);
    if(!S.mons[mi]) S.mons[mi] = {lv:1};
    confetti(); SFX.catch();

    /* 파트너가 한 뼘 자랍니다 */
    S.mons[S.partner].lv++;
    S.maxHp = pMaxHp(); S.hp = S.maxHp;
    S.megaOn = false;
    S.wild = null;
    S.screen = 'field';
    const eul = josa(m.n,['을','를']);
    S.msg = `축하해! ${m.n}${eul} 잡았다! 🎉 (${S.dex.length}/${MONS.length})`;
    save(); render();
    say(`${m.n}${eul} 잡았다! 축하해!`);
    setTimeout(checkEvolve, 1500);
  }, 2700);
}

/* ---- 진화 ---- */
function checkEvolve(){
  const cur = pMon();
  if(!cur.evo || IDX[cur.evo] == null) return;
  if(pLv() < cur.evoLv) return;
  const ni = IDX[cur.evo], next = MONS[ni];
  const lv = pLv();

  S.mons[ni] = {lv};
  delete S.mons[S.partner];
  S.partner = ni;
  if(S.dex.indexOf(ni) < 0) S.dex.push(ni);
  S.maxHp = pMaxHp(); S.hp = S.maxHp;
  save();

  SFX.evolve();
  showEvo(cur, next, '진화!', ()=>{
    S.msg = `축하해! ${cur.n}${josa(cur.n,['이','가'])} ${next.n}${josa(next.n,['으로','로'])} 진화했다! ✨`;
    confetti(); render();
    say(`${cur.n}${josa(cur.n,['이','가'])} ${next.n}${josa(next.n,['으로','로'])} 진화했다!`);
  });
}

function showEvo(from,to,word,done){
  const box = document.getElementById('evo');
  box.className = 'on';
  box.innerHTML = `${artBox(from,0,'glow')}<div class="sticker word">${word}</div>`;
  const el = box.querySelector('.artbox');
  if(el) el.style.cssText = 'width:min(58vw,240px);height:min(58vw,240px)';
  say(word === '메가진화!' ? '메가진화!' : '어라? 모습이 변한다!');
  setTimeout(()=>{
    box.innerHTML = `${artBox(to,0,'')}<div class="sticker word">${to.n}</div>`;
    const e2 = box.querySelector('.artbox');
    if(e2) e2.style.cssText = 'width:min(58vw,240px);height:min(58vw,240px)';
    confetti();
  }, 1900);
  setTimeout(()=>{ box.className = ''; box.innerHTML = ''; if(done) done(); }, 3600);
}

/* ---- 이펙트 ---- */
function flash(){
  const f = document.getElementById('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
function confetti(){
  const box = document.getElementById('fx');
  const colors = ['#FFC93C','#E8412F','#63C266','#57BADF','#F2679B','#fff'];
  for(let i=0;i<30;i++){
    const c = document.createElement('div');
    c.className = 'conf';
    c.style.background = colors[i % colors.length];
    c.style.left = (35 + Math.random()*30) + '%';
    c.style.top = '42%';
    c.style.setProperty('--dx', (Math.random()*440-220)+'px');
    c.style.setProperty('--dy', (Math.random()*300+120)+'px');
    c.style.setProperty('--rot', (Math.random()*900-450)+'deg');
    c.style.animationDelay = (Math.random()*0.25)+'s';
    box.appendChild(c);
    setTimeout(()=>c.remove(), 2000);
  }
}

/* =========================================================
   8. 입력
   ========================================================= */

function act(a){
  ac();
  const p = a.indexOf(':');
  const cmd = p < 0 ? a : a.slice(0,p);
  const arg = p < 0 ? null : a.slice(p+1);
  switch(cmd){
    case 'newgame':
      if(S.partner != null && !confirm('처음부터 새로 시작할까요?\n지금까지 잡은 포켓몬이 모두 사라집니다.')) return;
      newGame(); break;
    case 'resume': S.screen='field'; S.msg=''; SFX.open(); render(); break;
    case 'pick':   choose(+arg); break;
    case 'mv':     move(arg); break;
    case 'dex':    S.screen='dex'; SFX.open(); render(); say(`포켓몬 ${S.dex.length}마리를 잡았어!`); break;
    case 'back':   S.screen='field'; S.msg=''; render(); break;
    case 'home':   S.screen='title'; render(); break;
    case 'atk':    attack(); break;
    case 'heal':   heal(); break;
    case 'ball':   openQuiz(); break;
    case 'run':    run(); break;
    case 'mega':   doMega(); break;
    case 'hear':   hearQuiz(); break;
    case 'ans':    answerFirst(+arg); break;
    case 'ord':    answerOrder(+arg); break;
    case 'info':   S.detail = +arg; SFX.open(); renderModal();
                   { const m = MONS[+arg]; say(m.n,{rate:0.8}); } break;
    case 'closeinfo': S.detail = null; renderModal(); break;
    case 'sayname':{ const m = MONS[+arg]; say(m.n,{rate:0.8}); setTimeout(()=>sayLetters(m.n), 750); } break;
    case 'buddy':  {
      const i = +arg;
      if(!S.mons[i]) S.mons[i] = {lv:1};
      S.partner = i;
      S.maxHp = pMaxHp(); S.hp = S.maxHp;
      S.megaOn = false; S.detail = null;
      /* 바꾼 친구를 바로 볼 수 있게 풀숲으로 */
      S.screen = 'field';
      S.msg = `${MONS[i].n}${josa(MONS[i].n,['과','와'])} 같이 가요!`;
      SFX.good(); save(); render();
      say(`${MONS[i].n}${josa(MONS[i].n,['과','와'])} 같이 가자!`);
      break;
    }
    case 'mute':
      S.voice = !S.voice;
      if(!S.voice && 'speechSynthesis' in window) speechSynthesis.cancel();
      save(); render();
      if(S.voice) say('소리를 켰어!');
      break;
    case 'nope': tone(200,0.09,'sine',0.04); break;
  }
}

function hook(el){
  el.addEventListener('click', e=>{
    const t = e.target.closest('[data-act]');
    if(!t || t.hasAttribute('disabled')) return;
    act(t.getAttribute('data-act'));
  });
  el.addEventListener('keydown', e=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest('[data-act]');
    if(!t || t.hasAttribute('disabled')) return;
    e.preventDefault();
    act(t.getAttribute('data-act'));
  });
}
hook(document.getElementById('app'));
hook(modalEl);
modalEl.addEventListener('click', e=>{ if(e.target === modalEl){ S.detail = null; renderModal(); } });

const KEYMAP = {ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
window.addEventListener('keydown', e=>{
  const dir = KEYMAP[e.key];
  if(dir && S.screen === 'field'){ e.preventDefault(); move(dir); }
});

let tsx=0, tsy=0;
document.addEventListener('touchstart', e=>{
  if(S.screen !== 'field' || !e.target.closest('#map')) return;
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(S.screen !== 'field' || !e.target.closest('#map')) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx>0?'r':'l') : (dy>0?'d':'u'));
}, {passive:true});
document.addEventListener('gesturestart', e=>e.preventDefault());

/* =========================================================
   9. 시작
   ========================================================= */

if(load()){ S.maxHp = pMaxHp(); if(!(S.hp > 0)) S.hp = S.maxHp; }
render();

})();
</script>

  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
